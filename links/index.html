    <script>
        // Link click tracking. Vercel records custom events on Pro plans; on Hobby the call is a harmless no-op.
        document.querySelectorAll('[data-link]').forEach(function (a) {
            a.addEventListener('click', function () {
                window.va('event', { name: 'link_click', data: { link: a.dataset.link } });
            });
        });

        var toast = document.getElementById('toast');
        function showToast(msg) {
            toast.textContent = msg;
            toast.classList.add('active');
            setTimeout(function () { toast.classList.remove('active'); }, 2200);
        }

        document.getElementById('share-btn').addEventListener('click', function () {
            var url = 'https://paulpio.com/links';
            if (navigator.share) {
                navigator.share({ title: 'Paul Piotrowski', url: url }).catch(function () {});
            } else if (navigator.clipboard) {
                navigator.clipboard.writeText(url).then(function () { showToast('Link copied to clipboard'); },
                    function () { showToast(url); });
            } else {
                showToast(url);
            }
        });
    </script>
